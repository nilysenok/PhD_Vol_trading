# Д16.7 (третий круг): обратная подгонка HAR-X <-> остаточный бустинг; код — scripts/analysis/d16_79.py --task bf; выход D16_7_h22 (вариант bf_stop)
name: d16_7_h22
h: 22
seeds: [42, 43, 44]
