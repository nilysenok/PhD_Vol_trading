# протокол B v2 (tune_Bv2.py, финальное обучение на всех строках, точки из Bv2_selected_h*.csv) — ворота совпадения с Bv2_*
# V9: бустинг на остатках HAR-J с поправкой; цель ln RV - ln F_HARJ_corr, sigma_pred = F_HARJ_corr * exp(прогноз остатка). Правило: остаётся при улучшении OOS-QLIKE разраб. набора >= 1% к bv2_base или снятии нарушения критериев
