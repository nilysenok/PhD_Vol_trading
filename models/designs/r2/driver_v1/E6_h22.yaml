- design: E_h22_E1_k1_E6
  h: 22
  seed: 42
  data:
    info_set: d
    embargo: h
    train_halt: keep
    target: ln_mean
    recency_halflife: inf
    history_start: 2014
    winsor: none
    train_target_estimator: RV10
    window: expanding
  leg:
    type: HARJ
    regressors: none
    enet:
      lambda:
      - 0.01
      - 0.1
      - 1
      alpha:
      - 0
      - 0.5
      - 1
    pooled_kappa: 1
    regime_count: 2
    robust: OLS
    struct: single
    struct_split: rv_whole
    tau_window: 22
    tau_extend: const
    moe: false
    moe_gate: logit
    moe_calib: none
    moe_hard: false
    panel: factor_shrink_05
    panel_beta_window: 252
    panel_market: RV_IMOEX
    refit: yearly
    rls_lambda: 1
    estimator: log_ols_calib
  boost:
    role: residual
    resid_source: in_sample
    lib: lightgbm
    grid: current
    early_stop: qlike_total
    monotone: false
    objective: l2_log
    clip_sigma: false
    shrink: 1
    linear_tree: false
    prob: false
    prob_dist: empirical
    prob_window: all
    boost_refit: yearly
    row_frac: 1
    grid_point: none
  features:
  - G0
  - G1
  calib:
    s2_est: sm
    kappa: 0.5
    s2_state: const
    c_qlike: false
    mz: false
    update: step
    order: s2_state_kappa>c_qlike>mz
    s2_embargo: true
  mh:
    scheme: decomp
    decomp_k: 1
    iterated_k: null
    persist: false
    slope: false
    reconcile: false
  ens:
    seeds: 1
    agg: mean
    lib_agg: best_by_LOYO
    leg_ens: single
    window_ens: false
    ticker_bag: false
    stack: false
    uncert_shrink: false
    ec: false
    range_guard: false
    leg_union: false
    leg_w: false
  selection:
    loyo_folds:
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021
    entry:
      wins_min: 3
      etalon: HARJ_s2_d0_sm
      c3_all_folds: true
      c124: as_R1
    sigma:
      mult: 2
      seeds: 10
      rule: D24_3
      paired_with: F_h_d0
      'True': finalists
    complexity_penalty:
      rank_delta: 1
      qlike_rel: 0.01
  guards:
    info_set_shift_check: true
    leak_detector: true
    read_after_2021: forbidden
  k16:
    gate: false
    tau:
    - 0.25
    - 0.5
    - 1
    - 2
    - 4
    k:
    - 3
    - 5
    - 10
    q:
    - 0.9
    - 0.95
    - 0.99
    measure: uroven
    regime_calib: none
  k18:
    lam_to_ref: false
    lam:
    - 0.25
    - 0.5
    - 0.75
    - 1
    ref: etalon
    ticker_choice: false
  k20:
    sign_delta: false
    delta:
    - 0.1
    - 0.2
    - 0.3
    base: noga
    reweight_abs_d: false
  schema: v2
  inputs:
    base_1:
      file: R2/cache/VYR/F_d0_s2emb_h1_s{seed}_val.parquet
    leg_1:
      ryad: HAR-J+s² d0 = E_1 (нога₁)
