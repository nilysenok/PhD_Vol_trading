faza: E
h: 22
osnova: финал R1 d0 (r01, все строки) и нога
blok: владелец 20:10
varianty:
- variant: E0 финал R1 d0
  modul: L>B>L3
  design: E_h22_F_R1_d0
  primechanie: ''
- variant: E0 нога финала
  modul: L>L3
  design: E_h22_F_R1_noga
  primechanie: ''
- variant: E1 разложение hyb₁
  modul: M
  design: E_h22_E1_k1
  primechanie: (hyb₁ + (h−1)·HAR₂₋h)/h
- variant: E1 разложение hyb₅
  modul: M
  design: E_h22_E1_k5
  primechanie: (hyb₅ + 17·HAR₆₋₂₂)/22
- variant: E2 forward HAR
  modul: M
  design: E_h22_E2
  primechanie: 'hyb₁ вместо RV_d; ❓ M: hyb₅ вместо RV_w — нет в коде'
- variant: E3 равные веса ног
  modul: E
  design: E_h22_E3
  primechanie: ½ HAR-J+s² + ½ HAR-X+s²
- variant: E3 по ⅓ с RVI
  modul: E
  design: E_h22_E3rvi
  primechanie: ⅓ HAR-J+s² + ⅓ HAR-X+s² + ⅓ RVI-anchor+s²
- variant: E4 AveW HAR-X
  modul: E
  design: E_h22_E4
  primechanie: 'окна: расширяющееся, 5 лет, 3 года'
- variant: E5 воздержание shock_fresh
  modul: G
  design: E_h22_E5
  primechanie: k ∈ {3, 5, 10} — вложенно по t; halt — только при сборке (A)
- variant: E7 Хьюбер
  modul: L
  design: E_h22_E7
  primechanie: '❓ M: «среднее прямого и итерированного HAR» — нет в коде'
- variant: фактор M (ворота B, околопороговый)
  modul: B,M
  design: E_E_h22_F_R1_d0_faktorM
  primechanie: ''
- variant: фактор L (ворота B, околопороговый)
  modul: B
  design: E_E_h22_F_R1_d0_faktorL
  primechanie: ''
- variant: фактор K (ворота B, околопороговый)
  modul: B
  design: E_E_h22_F_R1_d0_faktorK
  primechanie: ''
- variant: кл. 11–13 leg.struct=tau_midas
  modul: M
  design: E_h22_struct_tau_midas
  primechanie: в E, если модуль ставит DONE (дым); иначе — «не прошёл дым»
- variant: кл. 11–13 leg.struct=tau_boost
  modul: M
  design: E_h22_struct_tau_boost
  primechanie: в E, если модуль ставит DONE (дым); иначе — «не прошёл дым»
- variant: кл. 11–13 leg.struct=tau_rvi
  modul: M
  design: E_h22_struct_tau_rvi
  primechanie: в E, если модуль ставит DONE (дым); иначе — «не прошёл дым»
- variant: кл. 11–13 leg.struct_split=bv_plus_jump
  modul: M
