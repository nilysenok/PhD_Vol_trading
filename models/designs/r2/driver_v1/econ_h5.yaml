- design: econ_h5_HARX_mh.persist=OLS
  h: 5
  seed: 42
  data:
    info_set: d
    embargo: h
    train_halt: keep
    target: ln_mean
    recency_halflife: inf
    history_start: 2014
    winsor: none
    train_target_estimator: RV10
    window: expanding
  leg:
    type: HARX
    regressors:
    - S1
    - S2
    - S3
    - S4
    enet:
      lambda:
      - 0.01
      - 0.1
      - 1
      alpha:
      - 0
      - 0.5
      - 1
    pooled_kappa: 1
    regime_count: 2
    robust: OLS
    struct: single
    struct_split: rv_whole
    tau_window: 22
    tau_extend: const
    moe: false
    moe_gate: logit
    moe_calib: none
    moe_hard: false
    panel: false
    panel_beta_window: 252
    panel_market: RV_IMOEX
    refit: yearly
    rls_lambda: 1
    estimator: log_ols_calib
  boost:
    role: none
    resid_source: in_sample
    lib: lightgbm
    grid: current
    early_stop: native
    monotone: false
    objective: l2_log
    clip_sigma: false
    shrink: 1
    linear_tree: false
    prob: false
    prob_dist: empirical
    prob_window: all
    boost_refit: yearly
  features:
  - G0
  calib:
    s2_est: sm
    kappa: 0.5
    s2_state: const
    c_qlike: false
    mz: false
    update: step
    order: s2_state_kappa>c_qlike>mz
  mh:
    scheme: direct
    decomp_k: null
    iterated_k: null
    persist: OLS
    slope: false
    reconcile: false
  ens:
    seeds: 1
    agg: mean
    lib_agg: best_by_LOYO
    leg_ens: single
    window_ens: false
    ticker_bag: false
    stack: false
    uncert_shrink: false
    ec: false
    range_guard: false
  selection:
    loyo_folds:
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021
    entry:
      wins_min: 3
      etalon: HARJ_s2_d0_sm
      c3_all_folds: true
      c124: as_R1
    sigma:
      mult: 2
      seeds: 10
      rule: D24_3
      paired_with: F_h_d0
      'True': finalists
    complexity_penalty:
      rank_delta: 1
      qlike_rel: 0.01
  guards:
    info_set_shift_check: true
    leak_detector: true
    read_after_2021: forbidden
  schema: v1
  inputs:
    base_1:
      ryad: F_1(d0) — финал первого раунда h=1 на ногах d0 (hyb₁)
      file: R2/cache/VYR/F_d0_h1_s{seed}_val.parquet
    leg_1:
      ryad: HAR-J+s² d0 = E_1 (нога₁)
      file: vyr/etalon_d0_h1_val.parquet
      col: har_corr
