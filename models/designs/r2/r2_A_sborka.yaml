  22: d95552ddd5c0a7a0943e19f1c95236a00dec51d107eab3d9348e515f93792f53
gate_D_sha:             # h без gate_E: ворота D без лучшего дизайна (luchshiy: null) — на h остаётся F_h(d0) (STOP 21:06)
  1: 44b964b675a0edb26734e7441061b55fe8e37236baebbc5845985cbd51d390ea
h: {}                   # победителей R2 нет (вариант 1)
F_h_d0: [1, 5, 22]      # строка гибрида — F_h(d0) с s² сборки (R2/final/final_d0_s2emb_h{h}_test.parquet)

# Ворота E — формат r2_loyo.gate_E (PR #161): phase: E, h, pobeditel: {pobeditel: <единица> | 'F_h(d0)', V0, poryadok}.
