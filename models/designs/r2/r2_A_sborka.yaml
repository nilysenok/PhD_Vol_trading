# эмбарго s² — PR #194, #195, решение владельца 17:35): t−1 по OOS-остаткам val шагов окна, с эмбарго; на шагах 7–10 — остатки
# val 2022–2025 из test_locked (только part = val, метка R2-guard-s2). zamorozka (раздел 8 протокола) — справочный режим.
