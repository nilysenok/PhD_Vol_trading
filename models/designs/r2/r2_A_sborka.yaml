# До ворот E статус «ждёт ворот E»: r2_sborka_test.py отказывает (СТОП), test_locked не читается.
# После ворот E агент A заполняет gate_E_sha, h, F_h_d0 по R2/O/gate_E_h{h}.yaml и параметрам val (шаги <= 6), ставит
# status: zamorozheno и коммитит до запуска сборки; дальше файл не меняется (SHA — в журнале и SHA256.txt выхода).

# Решение владельца 26.10 (вечер): вариант 1 — победителей R2 нет, на h = 1, 5, 22 финал — F_h(d0) (F_d0_s2emb).
# После «да» на FINAL_DESIGN_round2: сверить gate-SHA ниже с R2/O (если ворота E перепишутся счётом на исправленной основе —
# обновить), поставить status: zamorozheno, закоммитить, затем `python3 scripts/analysis/r2_sborka_test.py`.
