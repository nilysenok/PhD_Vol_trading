[package]
name = "moex_iss"
version = "0.1.0"
edition = "2021"
description = "Проверка хранимых данных MOEX через ISS (дорожка Г)"

[workspace]

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.0.0", default-features = false }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "zstd"] }
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
