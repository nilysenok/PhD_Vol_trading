# Л-11 (Ж-078): уровни 2–3 прогона этапа 1, A′ из рядов. 54 × 24 = 1 296 конфигураций. Коммитится до счёта.
# Разложение 54 × 24 — умолчание архитектора (текста советника в репозитории нет, ❓ для дирижёра).
# Основная — умолчания; остальные 1 295 — чувствительность, выбор из них запрещён (Ж-078).
v: 1
uroven2:                      # сборка по стратегиям, 3 · 3 · 3 · 2 = 54
  ves: [ravnyj, obr_korr_126, obr_korr_252]
  lam: [net, 1, 2]            # лимит при совпадении сигналов |Σ a_k·pos_k| ≤ λ·max a_k; net — без лимита
  rho: [0.5, 0.7, net]        # порог дубля: стратегии с ρ > порога — одна компонента с одним весом; net — без схлопывания
  sostav: [proshedshie, vse6]
uroven3:                      # портфель, 4 · 2 · 3 = 24
  tsel_vol: [net, 10, 15, 20]   # % годовых; масштаб = min(1, цель/σ̂), без плеча
  okno_vol: [63, 126]           # дней, окно строго до d−1
  tormoz_mdd: [net, 10, 20]     # % просадки накопленного excess до d−1; при превышении масштаб ×0,5
umolchaniya:
  ves: ravnyj
  lam: net
  rho: net
  sostav: vse6
  tsel_vol: net
  okno_vol: 63
  tormoz_mdd: net
parametry:
  pereschet: mesyac           # веса и ρ пересматриваются в первый торговый день месяца по данным до d−1
  min_istoriya: 20            # дней; меньше — равные веса / масштаб 1
  tormoz_mnozhitel: 0.5
