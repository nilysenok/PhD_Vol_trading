# Сетка v3, S2 Bollinger (Ж-095, поглощает Ж-092). ПРОЕКТ на просмотр владельцу — до коммита в базу не счёт.
# Спецификация уровней 0–4: docs/otchety/2026-10-28_arhitektura_v3_proekt.md. Не больше 6 осей (Ж-095 а).
# Внимание (❓ В-3): при ishodnoe (окно 20, 2 STD) скор S2 совпадает со скором S1 — отличается только родной выход.
v: 3
format: zh047-setka-v3
punkt: "Ж-095 (итерация 27б)"
obekt: {tip: strategiya, sid: S2, semya: kontrtrend}
period: {otbor: train4, okno: "2016-01-01..2019-12-31", progrev: 2015, validation: zakryto}
zaderzhka: "решение 18:50 d, исполнение d+1 заявками (Ж-086, Ж-091)"
chestnaya: net
komissiya: {otbor: 0.0004}
tselevaya: msr_train4

fiks:
  signal: {bb_window: 20, z0: 2.0, obrezka_z: 3.0}          # z = (close − SMA)/STD; z0 = bb_std ishodnoe
  skor: {tip: z_sverh_poroga, norm: rang_252_pul_Sk, min_nabl: 20}
  g: [ne_novost_2.5, soglasie_otn_z, likvidnost_5pct]
  vhod: {tip: limit, k_e: 0.5, ed: sigma, zhizn: den}
  t_vyhod: open2
  pauza_2_stopa: 5
  stop_div: sdvig
  sigma: rv22
  kniga: {stavok_v_sektore: 3, netto_dolya_valovoy: 0.30, target: 0.08}

osi:
  porog:       {setka: [0.3, 0.5, 0.7], centr: 0.5}
  rho:         {setka: [0.2, 0.3, 0.5], centr: 0.3}
  k_s:         {setka: [1.5, 2.0, 3.0], centr: 2.0}
  okno_knigi:  {setka: [21, 63], centr: 21}
  tau:         {setka: [3, 5], centr: 3}
  tejk_signal: {setka: [k_srednemu, pol_puti, rodnoy_uroven], centr: k_srednemu}   # у S2 оба — SMA, но k_srednemu фиксирован на d (Ж-084), rodnoy_uroven пересчитывается каждый вечер (Ж-091) — не схлопываются

canon_v3: []
N_polnyy_kub: 324
