# Сетка v3 по Ж-106 («правила торговли v2»), S1 MeanRev. Проект архитектора на просмотр владельцу, до коммита в базу.
# Спецификация: docs/otchety/2026-10-28_msp_fazy_spec.md §13. Коммитится до счёта (otbor_statistika п. 1); хэш — в журнал.
# Порядок осей = размерности Соболя; порядок значений = соседство (плато по ближайшим соседям, Ж-106 п. 19).
# Сигнал — оси kub_S1.yaml без изменений. Старые оси vhod/zhizn/lestnica/R/k_x/tejk_signal/k_tr/bezubytok/razmer/q_sily/
# rezhim/filtr/storona/proverka/ed_lim/gap/t_vyhod — сняты (заменены осями ниже или зафиксированы, раздел fiksirovano).
v: 3
format: zh106-setka
sid: S1
semya: kontrtrend
period: train4
komissiya: 0.0004
sobol: {seed: 20261101, scramble: true, prohod1: 20000, prohod2: 100000}

signal:
  ma_window: {ishodnoe: 20, setka: [10, 13, 17, 20, 23, 27, 30]}
  z_entry:   {ishodnoe: 2.0, setka: [1.0, 1.33, 1.67, 2.0, 2.33, 2.67, 3.0]}
  z_exit:    {ishodnoe: 0.5, setka: [0.25, 0.33, 0.42, 0.5, 0.58, 0.67, 0.75]}

vhod:                                   # Ж-106 А
  k_e:     {setka: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5], ed: sigma, ot: close_d}      # лимит close_d·(1 − сторона·k_e·σ_d)
  T:       {setka: [1, 2, 3, 5]}        # тайм-аут заявки, дней; заявка снимается раньше, если сигнал исчез/сменил сторону
  reentry: {setka: [net, da]}

razmer:                                 # Ж-106 А.4, Г.15
  rho_pct:  {setka: [0.2, 0.3, 0.5, 0.75, 1.0]}           # риск на ставку, % капитала / (k_s·σ_d)
  m_score:  {setka: [net, lin_05_15, kvad_025_20]}         # множитель силы: 1 / 0,5+ранг / 0,25+1,75·ранг²
  rang_tip: {setka: [tikernyy, obshchiy, srednee]}         # какой ранг 252 (до d−1) идёт в m_score, tejk=sila_*, b0=sila
  sigma:    {setka: [rv5, ewma094, rv22, rv66]}            # σ_d уровней (оставлена из kub; ❓ Ф-33)

vyhod:                                  # Ж-106 Б
  tejk:         {setka: [rodnoy, kt0.5, kt1, kt1.5, kt2, kt3, sila_a05_b1, sila_a1_b1, sila_a05_b2, sila_a1_b2, net]}
                # rodnoy: SMA ∓ z_exit·STD; kt*: k_t·σ_d·√h, h = 3 (Ж-109 п. 5); sila_a*_b*: k_t = a + b·ранг, пары Ж-109 п. 5
  k_s:          {setka: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0]}    # стоп обязателен, net снят; сдвиг на дивиденд
  b0:           {setka: [net, 0.5, 1.0, 1.5, 2.0, sila_c1, sila_c2, sila_c3]}   # безубыток, σ; sila_c*: b0 = c·ранг, c ∈ {1, 2, 3} (Ж-109 п. 5)
  stop_v_plyus: {setka: [net, p1.5_q0.5, p2_q1, p3_q1.5]}
  trejling:     {setka: [net, ekstr1, ekstr1.5, ekstr2, ekstr3, stup0.5, stup1]}   # линия сигнала — только у тренда
  chastichnyy:  {setka: [net, d1_3_r1, d1_3_r1.5, d1_3_r2, d1_2_r1, d1_2_r1.5, d1_2_r2]}
  tau:          {setka: [5, 10, 20, net]}                  # предохранитель; исполнение open x+1 (Ж-086 п. 4)

dengi:                                  # Ж-106 В
  L:                {setka: [1.0, 1.5, 2.0, 3.0, 4.0]}     # валовая экспозиция книги; маржа КС + 2 % сверх 1
  sigma_target_pct: {setka: [8, 10, 15, 20]}
  okno_targeta:     {setka: [21, 63]}

fiksirovano:
  fdr: t0                                # Ж-106 п. 12; «доля баров следующего дня» — справочно
  zaem_pct_god: 5                        # только перенос через ночь (Ж-089)
  proverka: bars5m                       # заявки исполняются по 5-мин барам (Ж-091 п. 1.3)
  vyhod_po_signalu: smena_storony_stop_zayavkoy   # Ж-106 п. 11; выход на уровень — tejk = rodnoy
  gap: open                              # гэп через уровень — по open (Ж-091 п. 1.3)
  odin_bar: stop_pervym

kanon:                                   # схлопывания (тест на каждое)
  - "m_score = net и tejk ∉ sila_* и b0 ∉ sila_* → rang_tip = obshchiy"

obyom:                                   # scratchpad/msp/obyom_v3.py
  signal: 343
  torgovye: 143061811200
  polnyy: 4.907e+13
  posle_kanona: 4.473e+13
