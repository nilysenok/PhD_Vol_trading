# Сетка этапа 1 (Ж-047 п. 3), S1 Z-score возврат к средней. Коммитится до счёта; N копится (Ж-047 п. 4).
# Контракт оценщика, порядок оси, якорь, вырожденные точки — docs/otchety/2026-10-27_zh047_kontrakt.md.
# Порядок значений на оси = порядок соседства (Моррис: шаг на соседнее значение; плато: ±1 шаг).
v: 1
format: zh047-setka
punkt: "Ж-047"
obekt: {tip: strategiya, sid: S1, semya: Contrarian}
fiks: "fastbt/designs/sweep/ekviv_20.yaml#S1_a"     # все параметры Sk, кроме сигнала, — исходная точка
period: {morris: train, faktornyy: train, validation: zakryto}   # train = 2018–2019; запасной Моррис — ctrl2019 (Ж-047 п. 6)
komissiya: {otbor: 0.0004, pereschet: [0.00035]}
tselevaya: min_msr_2018_2019          # Ж-043

signal:          # ±50 % вокруг исходной, 7 точек; целые — округление до ближайшего
  ma_window: {ishodnoe: 20, setka: [10, 13, 17, 20, 23, 27, 30]}
  z_entry:   {ishodnoe: 2.0, setka: [1.0, 1.33, 1.67, 2.0, 2.33, 2.67, 3.0]}
  z_exit:    {ishodnoe: 0.5, setka: [0.25, 0.33, 0.42, 0.5, 0.58, 0.67, 0.75]}

obshchie:        # одинаковы для S1–S6; yakor — значение «всё выключено» (якорь = «A только Sk», допуск 1e-12)
  q_sily:    {setka: [0.0, 0.5, 0.7, 0.8, 0.9], yakor: 0.0, okno: 252, min_nabl: 20, primenenie: vhod}
  sigma:     {setka: [rv5, ewma094, rv22, rv66], yakor: rv22}
  vhod:      {setka: [rynok, 0.25, 0.5, 0.75, 1.0], yakor: rynok, neispolnen: propusk}   # k_e: L = close_d·(1 − k_e·σ)
  k_s:       {setka: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0, net], yakor: net}
  R:         {setka: [1.0, 1.5, 2.0, 3.0, 4.0, net], yakor: net}                         # k_t = R·k_s; при k_s = net тейка нет
  k_tr:      {setka: [1.5, 2.0, 3.0, net], yakor: net}
  bezubytok: {setka: [net, plus1sigma], yakor: net}
  tau:       {setka: [1, 2, 3, 5, 10, 20, net], yakor: net}
  proverka:  {setka: [zakrytie, bars5m], yakor: zakrytie}
  razmer:    {setka: [15, 20, 25, ravnyy], yakor: ravnyy, limit_L: 1.0}                 # цель σ портфеля, % годовых
  rezhim:    {setka: [net, imoex_ma200, rang_sigma_rynka_08], yakor: net}
  sobytiya:  {setka: [net, cbr, div, cbr_div], yakor: net}                             # до блока 23:00 — умолчание

morris: {r: 20, seed: 20261027, shag: sosed, k: 15, N: 320}            # N = r·(k+1)
faktornyy: {vybor: "топ-5 по μ*; если куб > 5000 — топ-4", potolok: 5000, ostalnye: yakor}
plato: {osi: [k_s, R, tau], radius: 1, min_sosedey: 3, uslovie: "min mSR соседа > 0"}
N_polnyy_kub: 7744665600              # справочно: 343 сигнальных × 22 579 200 общих
