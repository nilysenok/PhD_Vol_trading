# Сетка v3, S7 кросс-секционный разворот (Ж-093 п. 4, Ж-095 1.1). ПРОЕКТ на просмотр владельцу — до коммита в базу не счёт.
# Определение и данные — §2.6 записки docs/otchety/2026-10-28_arhitektura_v3_proekt.md. Всегда лонг-шорт нейтральна.
v: 3
format: zh047-setka-v3
punkt: "Ж-095 (итерация 27б)"
obekt: {tip: strategiya, sid: S7, semya: kontrtrend_ks}
period: {otbor: train4, okno: "2016-01-01..2019-12-31", progrev: 2015, validation: zakryto}
zaderzhka: "решение 18:50 d, исполнение d+1 по open 10:00 (Ж-086)"
