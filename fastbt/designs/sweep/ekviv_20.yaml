# 20 фиксированных точек сверки оценщика перебора с боевым путём s9 (Ж-040 п. 2). Зафиксированы ДО счёта.
# (а) tsentr — центр сетки S{k}_setka_e1b.yaml (`sweep_setka.expand(...)["base"]`, ровно то, что считает перебор);
# (б) ispolnenie — центр + одно ненулевое значение слоя исполнения (узел exec_grid), S6 — все четыре вместе: именно там была ошибка двойного знака;
# (в) kandidat — лучший кандидат из docs/tables/sweep_e1v2/S{k}_top3.csv: режим plato, rank 1, комиссия отбора 0,04 %;
# A_2018, A_2019 — исходная A (боевая, из кэша s9): Engine.port против sweep_a_core.assemble на тех же позициях.
# etalon: da — боевой путь (ApproachA.raw_pos + exec_layer + tfilter) может воспроизвести точку; net — нет, причина в `prichina`
# (тест сверяет это поле с автоматической классификацией: смена класса видна в диффе).
# Допуск (объявлен до счёта): позиции — побайтно (numpy.array_equal на float64), дневной PnL — abs ≤ 1e-12, Шарп — по тем же рядам.
