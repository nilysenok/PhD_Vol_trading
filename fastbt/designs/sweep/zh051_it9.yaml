tselevaya: min_msr_2018_2019
reshenie: >-
  Тень — та же точка без тормоза, ряд excess на 2017–2019 (2017 — прогрев, в метрики не входит). Кривая E_d = сумма excess строк ≤ d−1
  (строка t — интервал close t → close t+1, известна на close t+1). DD_d = max_{s≤d} E_s − E_d. σ_a,d = ст. откл. excess строк d−252…d−1 × √252.
  Тормоз включается на close d, если DD_d > k·σ_a,d; пока включён — новые входы запрещены (открытые не закрываются).
  Лимит на сектор — не больше n одновременных сделок стратегии в секторе; занятость и порядок — как в итерации 3 (балл |strength|/σ).

osi:
  tormoz_k:
    setka: [0.25, 0.5, 1.0, net]
    vykl: net
  vosstanovlenie:                        # выключение тормоза: через 10 или 20 торговых дней, либо когда DD_d < k·σ_a,d / 2
    setka: [pauza_10, pauza_20, polovina]
  limit_sektor:
    setka: [1, 2, net]
    vykl: net

nedopustimo:
  - "tormoz_k == net and vosstanovlenie != pauza_20"   # без тормоза восстановление не влияет — одна точка
N: {S1: 29, S2: 29, S3: 29, S4: 29, S5: 29, S6: 29}    # (1 + 3·3) состояний тормоза × 3 лимита − 1
