# Сетка v3 по Ж-106, S3 Donchian (тренд). Проект на просмотр владельцу. Общие правила — zh106_S1.yaml; спецификация §13.
v: 3
format: zh106-setka
sid: S3
semya: trend
period: train4
komissiya: 0.0004
sobol: {seed: 20261103, scramble: true, prohod1: 20000, prohod2: 100000}

signal:
  dc_window: {ishodnoe: 20, setka: [10, 13, 17, 20, 23, 27, 30]}

vhod:
  k_e:     {setka: [-0.5, -0.25, 0.0, 0.25], ed: atr14, ot: uroven_proboya}   # стоп-заявка на уровне пробоя + k_e·ATR (k_e < 0 — откат к уровню, лимит)
