  chastichnyy:  {setka: [net, d1_3_r1, d1_3_r1.5, d1_3_r2, d1_2_r1, d1_2_r1.5, d1_2_r2]}
  piramida:     {setka: [0, 0.5, 1.0]}     # добавка при +1σ в плюсе, ≤ 2 добавок, риск ставки ≤ 2ρ; против позиции — запрещено
  tau:          {setka: [5, 10, 20, net]}

dengi:
  L:                {setka: [1.0, 1.5, 2.0, 3.0, 4.0]}
  sigma_target_pct: {setka: [8, 10, 15, 20]}
  okno_targeta:     {setka: [21, 63]}

fiksirovano: {fdr: t0, zaem_pct_god: 5, proverka: bars5m, vyhod_po_signalu: smena_storony_stop_zayavkoy, gap: open, odin_bar: stop_pervym}
