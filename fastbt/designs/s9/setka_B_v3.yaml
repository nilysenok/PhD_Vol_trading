# Сетка B шага 3′ главы 4 (постановка v3 §0.6, «Шаг 3′»). Объявлена и закоммичена до счёта.
# Как в С9 (S9.run_b / b_weights): вес w = min(cap, медиана_252(σ) / σ), полоса удержания band;
# позиция = A × w. σ проходятся по очереди: наивная → HAR-J → гибрид; h = 1 и 5.
# Отбор — С8 v2 при 0,04 % (Ъ 27.10, 12:05); пересчёт при 0,035; 0,05/0,06 — приложение.
# Если ни одна точка не проходит ни на одной σ — «B не фиксируется — отрицательный результат разработки».
#
# Условие 3 (к2) для B: определение §0.4 — круговой сдвиг МАСКИ 0/1 (сохраняет долю дней и длины серий);
# у B масштаб w ∈ (0, cap]. Сдвиг ряда весов считается (мультимножество весов и оборот сохраняются), но как
# условие отбора НЕ применяется — решение владельца; в таблицах: p_vs_k2_masshtab — справочно.
