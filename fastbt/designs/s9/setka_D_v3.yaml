# Сетка D шага 3′ главы 4 (постановка v3 §0.6, «Шаг 3′»). Объявлена и закоммичена до счёта.
# Семьи — как в С9 (S9.d_points, окна v2 = 126/252/504, min_periods как s9._minp); формулы не меняются.
# Сигнал, привязанный к RVI, — RVI_{d−1} (rvi_1850, PR #245): семья D6lag1 (отношение σ_pred·√252·100 / RVI_{d−1}).
# Семья D6 с RVI_d (lag 0) в сетку НЕ входит: она нужна только как мутация в тестах (утечка дня d).
# Остальные семьи RVI не используют, считаются по σ шага (наивная → HAR-J → гибрид, h = 1 и 5).
# Отбор — С8 v2 при 0,04 % (Ъ 27.10, 12:05); те же точки пересчитываются при 0,035; 0,05/0,06 — приложение.
# Экран доли закрытых дней [0,10; 0,50] (как в С9) применяется при счёте к маскам и в точки не входит;
# D7 — масштаб, экран не применяется. Дизайны с внутренним выбором («выбор по валидации») — не кандидаты.
pometka: разработка 2018–2021, после аудита
rvi: {file: rvi_1850, lag: 1, semya: D6lag1}
okna: [126, 252, 504]
semyi:
  D1:      {tochek: 9,  opisanie: "ранг σ в окне W > p → 0; W × p ∈ {70, 80, 90}"}
  D2:      {tochek: 18, opisanie: "гистерезис: выход выше p, возврат ниже p − g; W × p × g ∈ {10, 20}"}
  D4:      {tochek: 27, opisanie: "ранг EMA(σ, span) в окне W; span ∈ {3, 5, 10} × W × p"}
  D5:      {tochek: 3,  opisanie: "рост σ за 5 дней > x → 0; x ∈ {20, 30, 50} %"}
  D6lag1:  {tochek: 3,  opisanie: "ранг σ/RVI_{d−1} в окне 252 > p → 0; p ∈ {70, 80, 90}"}
  D7:      {tochek: 6,  opisanie: "масштаб min(1, (медиана σ в окне W / σ)^γ); W × γ ∈ {1, 2}"}
tochek_na_ryad_sigma: 66
ryady_sigma: [naive_h1, naive_h5, harj_h1, harj_h5, hyb_h1, hyb_h5]
# naive_h5 ≡ naive_h1 (√RV_w от h не зависит): 66 дублей, различных точек 330
tochek_vsego: 396
tochek_razlichnyh: 330
komissii: {osnovnaya_otbor: 0.0004, pereschet: 0.00035, prilozhenie: [0.0005, 0.0006]}
