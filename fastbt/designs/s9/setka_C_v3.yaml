# Сетка C для шагов 1–3 главы 4 (постановка v3 §0.6, Ъ владельца 27.10). Объявлена и закоммичена до счёта.
# Читает scripts/analysis/s9_shag_c.py; прежний setka_C.yaml не тронут (им пользуется fastbt.s9 run --c8v2).
pometka: разработка 2018–2021, после аудита
gate:   # затвор g по рангу R_d — доля значений окна [d−W, d−1] строго меньше x_d (текущий день не входит)
  filtr: "тренд 1[R > 1−p]; контртренд 1[R < p]; диапазон 1[1−p ≤ R ≤ p]; ранг NaN → g = 1 (fastbt.s9._c_gate)"
  chastichnaya: "1 → 0,5 → 0 по двум порогам (p1 < p2), формулы C2 в fastbt.s9._c_gate"
# Условие 1 С8 v2 (постановка v3 §0.5 — «все 4 года Δ к A > 0»). strogo — 4/4 (умолчание); odno_isklyuchenie — как s9.c8 (3/4).
# Умолчание strogo выбрано дирижёром до ответа владельца; CLI: --c8-uslovie1 переопределяет.
uslovie1: strogo
okna: [126, 252, 504]
min_periods: {126: 50, 252: 50, 504: 252}   # W504 — растущее окно 252 → 504 (§0.6)
p: [50, 60, 70, 80, 90]                      # закрыта на p50: ниже медианы — выход из рынка, не фильтр
h: [1, 5]
rvw:                                         # √RV_w, известна на закрытии d (для C*)
  file: data/regen/ch4_dev/sigma_naive_dev.parquet
  column: sigma_pred_h1
semyi:
  C1:  {signal: sigma,            filtr: [50, 60, 70, 80, 90]}
  C2W: {signal: sigma,            chastichnaya: [[50, 60], [60, 70], [70, 80], [80, 90], [50, 70], [60, 80], [70, 90]]}
  C*:  {signal: sigma_over_rvw,   filtr: [50, 60, 70, 80, 90],
        chastichnaya: [[50, 60], [60, 70], [70, 80], [80, 90], [50, 70], [60, 80], [70, 90]]}
# Пары C2W — все пары сетки p с разностью 10 и 20 п. (7 штук): та же схема, что в прежнем setka_C.yaml
# (70/90, 80/90, 70/80 и расширение 50/60, 50/70, 60/70, 60/80). Пары с разностью 30–40 п. не вводились.

# Точек на один ряд σ и один h: C1 3×5 = 15; C2W 3×7 = 21; C* 3×(5 + 7) = 36.
tochek_na_ryad: {C1: 15, C2W: 21, "C*": 36}
sigmy:
  hyb:   {h: [1, 5], tochek: 144}   # (15 + 21 + 36) × 2
  harj:  {h: [1, 5], tochek: 144}
  naive: {h: [1],    tochek: 36}    # (15 + 21) × 1
isklyucheno:
  naive_C*: >-
    Семья C* на наивной σ исключена: σ̂/√RV_w ≡ 1, ранг постоянной величины вырожден (все ранги равны 0 при
    строгом «меньше», затвор не отражает информации). Выбор: исключить, не включать вырожденные точки.
  naive_h5: >-
    На наивной σ h = 5 исключён: √RV_w не зависит от h (SOURCES_V2: naive_h5 читает тот же столбец sigma_pred_h1),
    точки h=5 повторяли бы h=1 побайтно и удваивали число кандидатов отбора без новой информации.
razlichiya_ot_staroy_setki:
  sovpadaet: "C1 (p50…p90 × W126/252/504), C2W (7 пар на W126/252/504; W252 раньше назывался C2), min_periods, √RV_w"
  novoe: "C* получил p50/p60 и пары 50/60, 60/70, 50/70, 60/80 (раньше C*1 — p70/80/90, C*2 — пары 70/90, 80/90, 70/80)"
  chisla: "на σ гибрид/HAR-J: было 54 на h (C1 15 + C2/C2W 21 + C*1 9 + C*2 9), стало 72; наивная: 36 на h → 36 (только h=1)"
  ne_stroitsya: "семьи «выбор по валидации» (внутренний выбор) и C основного дизайна u02 — не кандидаты (§0.5)"
