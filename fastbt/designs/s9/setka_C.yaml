# Сетка C в С9 (fastbt.s9, S9.run_c). Ъ владельца 26.10, 22:30: «единственные дополнения к С9 —
# семья C* (ранг σ_pred/√RV_w) и частичная экспозиция 1→0,5→0 — как новые точки сетки C в том же yaml».
# Объявлена до прогона; без отбора по результатам (выбор — по С8 в общем прогоне С9). Пометка «до аудита».
#
# Затвор g ∈ {0; 0,5; 1} по категории стратегии (тренд S3/S4, контртренд S1/S2, диапазон S5/S6),
# позиция = A × g; ранг NaN → g = 1. Ранг R_d — доля значений окна [d−W, d−1] строго меньше x_d
# (fastbt.s9_stats.past_rank), текущий день в окно не входит.
#   фильтр p:            тренд 1[R > 1−p]; контртренд 1[R < p]; диапазон 1[1−p ≤ R ≤ p]
#   частичная (p1, p2):  1 → 0,5 → 0 по двум порогам (формулы C2 в S9.c_points)
pometka: до аудита

# Как были (в коде S9.c_points, без изменений; включены всегда):
kak_byli:
  C1: {signal: σ_pred, okna: [126, 252, 504], min_periods: "max(50, W/5)", filtr_p: [70, 80, 90]}   # 9
  C2: {signal: σ_pred, okna: [252], min_periods: 50, chastichnaya: [[70, 90], [80, 90], [70, 80]]}  # 3

# Новые точки (включаются флагом fastbt.s9 run --c-dop <этот файл>; без флага сетка С9 прежняя):
dop:
  min_periods: {126: 50, 252: 50, 504: 252}     # W504 — растущее окно от 252 (Ъ, вариант (а))
  rvw:                                           # √RV_w, известна на закрытии d
    file: data/regen/ch4_dev/sigma_naive_dev.parquet
    column: sigma_pred_h1
  semi:
    C2W:   # частичная экспозиция по уровню σ_pred на окнах, которых нет в C2
      signal: sigma
      okna: [126, 504]
      chastichnaya: [[70, 90], [80, 90], [70, 80]]
    C*1:   # неожиданность: фильтр по рангу σ_pred / √RV_w
      signal: sigma_over_rvw
      okna: [126, 252, 504]
      filtr: [70, 80, 90]
    C*2:   # неожиданность: частичная экспозиция 1 → 0,5 → 0
      signal: sigma_over_rvw
      okna: [126, 252, 504]
      chastichnaya: [[70, 90], [80, 90], [70, 80]]
  # C* не строится на самой наивной σ (σ/√RV_w ≡ 1)
  tochek_na_sigma: {C2W: 6, C*1: 9, C*2: 9, vsego: 24}
  tochek_na_naive: {C2W: 6}
