# Сетка C в С9 (fastbt.s9, S9.run_c). Ъ владельца 26.10, 22:30: «единственные дополнения к С9 —
# семья C* (ранг σ_pred/√RV_w) и частичная экспозиция 1→0,5→0 — как новые точки сетки C в том же yaml».
# Объявлена до прогона; без отбора по результатам (выбор — по С8 в общем прогоне С9). Пометка «до аудита».
#
# Затвор g ∈ {0; 0,5; 1} по категории стратегии (тренд S3/S4, контртренд S1/S2, диапазон S5/S6),
# позиция = A × g; ранг NaN → g = 1. Ранг R_d — доля значений окна [d−W, d−1] строго меньше x_d
# (fastbt.s9_stats.past_rank), текущий день в окно не входит.
#   фильтр p:            тренд 1[R > 1−p]; контртренд 1[R < p]; диапазон 1[1−p ≤ R ≤ p]
#   частичная (p1, p2):  1 → 0,5 → 0 по двум порогам (формулы C2 в S9.c_points)
pometka: до аудита

# Как были (в коде S9.c_points, без изменений; включены всегда):
kak_byli:
  C1: {signal: σ_pred, okna: [126, 252, 504], min_periods: "max(50, W/5)", filtr_p: [70, 80, 90]}   # 9
  C2: {signal: σ_pred, okna: [252], min_periods: 50, chastichnaya: [[70, 90], [80, 90], [70, 80]]}  # 3

# Новые точки (включаются флагом fastbt.s9 run --c-dop <этот файл>; без флага сетка С9 прежняя):
dop:
  min_periods: {126: 50, 252: 50, 504: 252}     # W504 — растущее окно от 252 (Ъ, вариант (а))
  rvw:                                           # √RV_w, известна на закрытии d
    file: data/regen/ch4_dev/sigma_naive_dev.parquet
    column: sigma_pred_h1
  semi:
    C2W:   # частичная экспозиция по уровню σ_pred на окнах, которых нет в C2
      signal: sigma
      okna: [126, 504]
      chastichnaya: [[70, 90], [80, 90], [70, 80]]
    C*1:   # неожиданность: фильтр по рангу σ_pred / √RV_w
      signal: sigma_over_rvw
      okna: [126, 252, 504]
      filtr: [70, 80, 90]
    C*2:   # неожиданность: частичная экспозиция 1 → 0,5 → 0
      signal: sigma_over_rvw
      okna: [126, 252, 504]
      chastichnaya: [[70, 90], [80, 90], [70, 80]]
  # C* не строится на самой наивной σ (σ/√RV_w ≡ 1)
  tochek_na_sigma: {C2W: 6, C*1: 9, C*2: 9, vsego: 24}
  tochek_na_naive: {C2W: 6}

  # Расширение сетки C порогами p50/p60 — Ъ владельца 27.10, 00:10 (дословно в docs/otchety/dev_log_K.md).
  # Добавлено ПОСЛЕ просмотра разработки 2018–2021 (выбранная C1 W126 p70 h5 лежала на краю сетки
  # порогов), ДО открытия теста. Объявлено и закоммичено до счёта (агент К). Включается флагом
  # fastbt.s9 run --c8v2 (вместе с --c-dop и --sigma-set v2); без флага сетка C прежняя побайтно.
  # Формулы затвора — те же (_c_gate = S9.c_points), min_periods — как выше (126: 50, 252: 50,
  # 504: 252 = s9._minp в v2). Семья «выбор по валидации» для этих точек не строится: прежние семьи
  # C1/C2/C2W выбирают среди прежних точек, как были.
  # Частичная экспозиция продолжает прежнюю схему пар {70/80, 80/90, 70/90} (разность 10 и 20 п.):
  # новые пары — нижний порог 50 или 60, разность 10 и 20 → 50/60, 50/70, 60/70, 60/80.
  # Имя семьи по прежней схеме: частичная на W252 — C2, на W126/W504 — C2W.
  rassh:
    C1:    # фильтр по уровню σ_pred, как C1 (S9.c_points)
      signal: sigma
      okna: [126, 252, 504]
      filtr: [50, 60]
    C2:    # частичная 1 → 0,5 → 0 на W252, как C2
      signal: sigma
      okna: [252]
      chastichnaya: [[50, 60], [50, 70], [60, 70], [60, 80]]
    C2W:   # частичная 1 → 0,5 → 0 на W126 и W504, как C2W
      signal: sigma
      okna: [126, 504]
      chastichnaya: [[50, 60], [50, 70], [60, 70], [60, 80]]
  # новых точек на каждую σ (гибрид, HAR-J (б), наивная; h=1 и h=5 — 6 рядов σ): C1 6 + C2 4 + C2W 8 = 18;
  # всего новых строк 108; кандидатов отбора C (гибрид h1 + h5): было 84, станет 120
  # (фиксированных точек на σ: было 36 у гибрида/HAR-J и 18 у наивной, станет 54 и 36)
  tochek_rassh_na_sigma: {C1: 6, C2: 4, C2W: 8, vsego: 18}
  tochek_rassh_vsego: 108

  # сетка закрыта на p50 (Ъ 27.10, 01:30): точек ниже p50 не добавлять.
  # Контроли v3 (Ъ 27.10, блок 01:30: «к1 снять / к2 круговой сдвиг / к3 A без S5/S6; С8 v2»).
  # Заменяют контроли feb8a30. Объявлены до счёта таблиц. Флаг --c8v2, 2018–2021.
  # к1 снят: Шарп не зависит от масштаба позиции (A × c даёт Шарп A) — контроль вырожден.
  # к2 со случайной перестановкой снят: случайная маска переключается чаще точки и платит комиссию.
  kontroli:
    k2: >-
      (v3 §0.4, Ъ 27.10; заменяет определение из #260) круговой сдвиг маски экспозиции точки
      по каждому тикеру на случайный лаг ∈ [21, T−21], независимо по тикерам; маска — затвор g точки
      по всем торговым дням 2018–2021 тикера (T — длина этого ряда), все стратегии тикера
      сдвигаются одним лагом; позиция к2 = A × сдвинутая маска. Сохраняет оборот, длины серий,
      долю дней. 1 000 повторов, seed 20261027, одни и те же для всех точек;
      p_vs_k2 = (1 + #{Шарп сдвига ≥ Шарп точки}) / (N + 1)
    k3: >-
      A без диапазонных стратегий S5/S6: позиции A, в которых S5 и S6 обнулены на всех днях 2018–2021;
      комиссия и ставка — как у A; столбцы sharpe_k3, d_vs_k3 = Шарп точки − Шарп к3,
      p_vs_k3 — Ледуа–Вольф, блок 5, 10 000 повторов (как Δ к A)
    n_shift: 1000
    seed: 20261027
    min_shift_dney: 21
    pravilo_C8_v2: >-
      прежние условия С8 (c8) И Шарп точки > Шарп к3 И p_vs_k2 < 0,05 на 2018–2021;
      выбор — среди прошедших, прежним rank_c8; строки «прошла С8» и «прошла С8 v2» — рядом
