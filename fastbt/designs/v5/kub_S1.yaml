# Куб отбора v5, S1 MeanRev (Ж-127 п. 2; docs/otchety/2026-10-29_setka_v5.md §1, §2.3; README этого каталога). Коммитится до счёта
# (otbor_statistika.md п. 1). Порядок осей (signal, filtr, vhod, vyhod) = размерности Соболя; порядок значений = соседство для плато.
# Значения — zh126 (fastbt/designs/zh126/zh126_S1.yaml, zh126_obshchee.yaml) + §1; где zh126 шире §1 — zh126 (README «Сверка»).
# Канон и свёртки — fastbt/canon_v5.py; объём номинальный и после свёрток — `python3 -I fastbt/canon_v5.py`.
# Решения (класс B дирижёра, 29.10; Ъ владельца — Ж-129):
#  (1) fdr: t0d — основной режим новых сеток (fastbt/fdr.py:9 OSNOVNOY, Ж-111 п. 12); README пишет «t0», это то же правило.
#  (2) оси zh047 закреплены (yakorya_progon) и в N не входят — Ъ Ж-129 (4).
#  (3) уровень размера 1–50 % — слой портфеля, не куб; в кубе — тип размера (по σ) и сила сигнала — Ъ Ж-129 (5).
#  (4) N1 = 32 768 на стратегию (§2.3); seed и seed2 объявлены здесь; второй seed — проход устойчивости (Ж-130).
#  (5) Ъ Ж-129 (6): fixed_atr = chandelier — одна ось: значения chand:k свёрнуты в atr:k; безубыток — от ATR входа.
# ↺ — hurst_th, slope_max не в кубе: fastbt/signals/v5_filtr.py их не считает (оценщик молча игнорировал бы ось) · откат: добавить
#   после реализации в v5_filtr расширением сетки с датой, N обновить (29.10).
# ↺ — безубыток в σ снят: Ж-129 (6) «безубыток — от ATR входа»; ed_s у стопа и безубытка общий (exec_e_types.py), поэтому
#   bezubytok atr:k допустим только при stop_nach atr:k, rang:c — при стопе σ или ATR (иначе точка выбрасывается в canon_v5)
#   · откат: вернуть sigma:0,5…2 в bezubytok (29.10).
v: 3
format: progon-kub
setka: v5
sid: S1
tip: kontr
period: train4                 # первый проход; второй — v2 (В2, Ж-113: 2015–2019, прогрев с 06.2014) — тот же куб, свой период ledger
periody: [train4, v2, wf]
komissiya: 0.0004
fdr: t0d
sobol: {seed: 20261030, seed2: 20261031, scramble: true, N1: 32768}
istochniki: {zh126: fastbt/designs/zh126/zh126_S1.yaml, v4: c22a4b36, r: 6a7a4636, setka: docs/otchety/2026-10-29_setka_v5.md}
zakrepleno: {tf: den, proverka: bars5m}      # ось tf (#593) — отдельный проход позже; заявки внутри дня — по 5-мин барам

signal:
  ma_tip:    {setka: [sma, ema, wma, hma, dema, tema, kama]}               # zh126 6 + tema (расширение Ж-125 п. 1); hull = hma
  ma_window: {setka: [3, 5, 7, 10, 12, 15, 18, 20, 25, 30, 35, 40, 50, 60, 80, 100, 120, 150, 200]}
  dev_tip:   {setka: [std, atr]}
  z_entry:   {setka: [0.3, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0, 3.5, 4.0, 5.0]}   # zh126: 2 × 13 = 26 ≥ §1 23
  z_exit:    {setka: [net, 0.3, 0.5, 0.7]}                                 # v4 strategies_walkforward.py:79; net — выход только по РМ

filtr:
  adx_th:      {setka: [0, 15, 20, 25, 30, 35, 40], yakor: 0}
  atr_lo:      {setka: [0, 5, 10, 15, 20, 25], yakor: 0}
  vol_th:      {setka: [0, 0.5, 0.7, 1.0, 1.2, 1.5], yakor: 0}
  rsi_th:      {setka: [0, 20, 25, 30, 35, 40], yakor: 0}
  mom_n:       {setka: [0, 1, 2, 3, 5, 7, 10], yakor: 0}
  dow:         {setka: [0, 1, 2, 3], yakor: 0}
  squeeze_pct: {setka: [0, 25, 40, 50, 60], yakor: 0}

vhod:
