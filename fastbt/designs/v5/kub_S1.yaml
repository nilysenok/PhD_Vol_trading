                         sigma:1.0, sigma:1.5, sigma:2.0, sigma:2.5, sigma:3.0, sigma:4.0], yakor: sigma:2.0}
  tejk:         {setka: [net, rr:0.5, rr:1.0, rr:1.5, rr:2.0, rr:2.5, rr:3.0, rr:4.0,
                         pct:0.003, pct:0.005, pct:0.01, pct:0.02, pct:0.03, pct:0.05, pct:0.07, pct:0.1, pct:0.15,
                         atr:0.5, atr:1.0, atr:1.5, atr:2.0, atr:3.0, atr:4.0, atr:5.0, atr:8.0, atr:10.0, rodnoy,
                         sigh:0.5, sigh:1.0, sigh:1.5, sigh:2.0, sigh:3.0, sila:0.5:1, sila:1:1, sila:0.5:2, sila:1:2], yakor: net}
  trail:        {setka: [net, atr:0.5, atr:1.0, atr:1.5, atr:2.0, atr:2.5, atr:3.0, atr:4.0, atr:5.0,
                         sigma:1.0, sigma:1.5, sigma:2.0, sigma:3.0, step:0.5, step:1.0], yakor: net}
  bezubytok:    {setka: [net, atr:0.5, atr:1.0, atr:1.5, atr:2.0, rang:1, rang:2, rang:3], yakor: net}
  stop_v_plyus: {setka: [net, "1.5:0.5", "2:1", "3:1.5"], yakor: net}
  tau:          {setka: [3, 5, 7, 10, 15, 20, 30, 50, 100, 200, net], yakor: net}
  chast:        {setka: [net, "1/3:1", "1/3:1.5", "1/3:2", "1/2:1", "1/2:1.5", "1/2:2"], yakor: net}
  pir:          {setka: [0, 0.5, 1], yakor: 0}
  smena:        {setka: [da, net], yakor: da}
  razmer_tip:   {setka: [ravnyj, risk_sigma], yakor: ravnyj}               # уровень (1–50 %, ρ) — слой портфеля, Ж-129 (5)
  m_sily:       {setka: ["1", lin, kvadr], yakor: "1"}
  rang_tip:     {setka: [tikernyj, obshchiy, srednee], yakor: tikernyj}

