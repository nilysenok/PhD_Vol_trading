#   поддержаны), тейк без pct/atr/rodnoy, без безубытка, «стопа в плюс», ступенчатого трейлинга и пирамидинга (exec_e_v6.py:27),
#   без T > 1 и reentry (exec_e.py:104), без smena (выход сменой стороны — сама стоп-заявка); RSI тренда — 6 значений, свёртка до 2
