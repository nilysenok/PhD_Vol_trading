# Сетка P1/P2 и проверка п. 6 (агент СP), объявлена до счёта 26.10.2026 22:25 (Мак).
# Постановка: docs/zadaniya/2026-10-26_razrabotka_strategiy_v2.md, п. 5–6 владельца 22:20,
# разведочный счёт «до аудита» (смягчение 22:25). Тест (≥ 2022) закрыт.
pometka: до аудита
period: {dev_years: [2018, 2019, 2020, 2021], val_start: 2017, maska: "_year_bounds(...)[0]"}
sigma:   # только файлы S0 (PR #234, #235), SHA сверены с data/regen/ch4_dev/SHA256.txt до счёта
  hyb_h1:    data/regen/ch4_dev/sigma_hyb_h1_dev.parquet      # 1a7dc719…
  hyb_h5:    data/regen/ch4_dev/sigma_hyb_h5_dev.parquet      # 7e93596d…
  harj_b_h1: data/regen/ch4_dev/sigma_harj_b_h1_dev.parquet   # 040e5440…
  harj_b_h5: data/regen/ch4_dev/sigma_harj_b_h5_dev.parquet   # b1ec0b6d…
  naive:     data/regen/ch4_dev/sigma_naive_dev.parquet       # 61e548c6…
A:
  istochnik: позиции A основного дизайна (main.yaml, ансамбль + фильтр оборота) из кэша разработки
             data/fastbt/s9/cache_89c0dd6160.pkl; A от σ не зависит (A в кэшах 89c0dd6160 и 571a6c5a07
             совпадает побитно); всё после 31.12.2021 отрезается сразу после загрузки
  C_B_D_iz_kesha: не используются (посчитаны на прежних σ)
# Опорные точки разведки (НЕ выбор по С8; после выбора СF пересчитывает P1/P2 на выбранных дизайнах)
opory:
  C: {semya: C1, W: 252, p: 0.80, sigma: hyb_h1, vid: "маска по категориям S1–S6 (тренд R>1−p, контртренд R<p, диапазон 1−p≤R≤p), ранг по прошлому окну"}
  B: {vid: "относительная σ_target: w = min(cap, медиана σ за 252 прошлых дня / σ)", cap: 1.0, polosa: 0.10, sigma: hyb_h5}
  D: {semya: D1, W: 252, p: 0.80, sigma: hyb_h1, ema: net, vid: "затвор: ранг σ по прошлому окну > p → 0", otsev_zakrytyh: [0.10, 0.50]}
  primechanie: "cap B = 1 и окно D W252 в постановке не названы — взяты как у прежней разработки С9 (cap1, D1 W252)"
P1:   # веса 1/σ_pred_i между тикерами: w_(пара,d) = (1/σ_i,d) / Σ_пар(1/σ_j,d); нет σ — среднее 1/σ даты
  bazy: [A, "A × C опорная"]
  vesa: [ravnye, 1/sigma hyb_h1, 1/sigma hyb_h5, 1/sigma harj_b_h1 (контроль), 1/sigma naive (контроль)]
  scenarij: спот (капитал 1, свободный — под ставку ЦБ)
  sravnenie: [ΔШарп к A (равные веса, без фильтра), ΔШарп к той же базе с равными весами]
  tochek: 8 (+2 эталона равных весов)
P2:   # равные доли капитала A / B / C / D (опорные), каждая со своей комиссией и ставкой на свободный капитал
  sostav: [A, B опорная, C опорная, D опорная]
  varianty: ["равные доли капитала (основной)", "среднее позиций A/B/C/D (справочно, взаимозачёт сделок)"]
  sravnenie: [ΔШарп к A, ΔШарп к лучшей одиночной]
metriki: [Шарп избыточной МСП, Сортино, Кальмар, просадка избыточной, экспозиция, оборот в год, комиссия % в год,
          Шарп по годам 2018–2021, худший год, ΔШарп к A, p ЛВ (круговой блок 5, 1 000 повторов, seed 42)]
komissiya: {osnovnaya: 0.0005, chuvstvitelnost: [0.0005, 0.0006], spravochno: 0.0}
proverka_p6:
  stavka: "по дням на датах смены ставки ЦБ 17.09.2018, 17.06.2019, 27.04.2020, 20.12.2021 (±2 торговых дня): ставка размещения = fdr / ((1 − экспозиция)·кал. дни) против ставки вычитания = (total − excess) / кал. дни, для A, B, C, D, P1, P2"
  komissiya: "сделки по обе стороны: синтетическая пара (вход 0→1, выход 1→0, разворот 1→−1) через Engine.port; тождество gross − r = c·оборот по дням; Шарп A и опорных B/C/D при 0,05 и 0,06%"
  rashozhdeniya: не чинить, описать и сообщить дирижёру (чинит FA)
prochee: {processov: "≤ 2", dannye: "загружаются в память один раз", kod: fastbt/dev_v2_p.py}
